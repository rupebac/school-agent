<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>B · Control Center — School Agent mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4f5f8;
    --panel: #ffffff;
    --side: #111827;
    --side-2: #1f2937;
    --side-text: #9ca3af;
    --ink: #0f172a;
    --ink-2: #334155;
    --muted: #64748b;
    --line: #e5e7eb;
    --line-2: #d6dae1;
    --accent: #4f46e5;
    --accent-soft: #eef0ff;
    --red: #dc2626; --red-soft: #fef2f2;
    --amber: #d97706; --amber-soft: #fffbeb;
    --green: #16a34a; --green-soft: #f0fdf4;
    --font: 'Geist', 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
  .i { flex: none; display: block; }

  .app { display: grid; grid-template-columns: 248px 400px minmax(0, 1fr); height: 100vh; }

  /* ---------- sidebar ---------- */
  .side { background: var(--side); color: var(--side-text); display: flex; flex-direction: column; padding: 16px 12px; gap: 4px; overflow-y: auto; }
  .logo { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 650; font-size: 1.02rem; padding: 4px 10px 18px; }
  .logo .m { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #6366f1, #a855f7); display: grid; place-items: center; }
  .side .lbl { font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; padding: 16px 10px 6px; color: #6b7280; }
  .nv { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-weight: 500; }
  .nv:hover { background: var(--side-2); color: #e5e7eb; }
  .nv.on { background: var(--side-2); color: #fff; }
  .nv .ct { margin-left: auto; font-size: .75rem; background: #374151; color: #e5e7eb; padding: 0 7px; border-radius: 999px; font-weight: 600; }
  .nv.on .ct { background: var(--accent); }
  .kv { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; color: #fff; font-size: .72rem; font-weight: 700; flex: none; }
  .nv small { margin-left: auto; color: #6b7280; }
  .side-foot { margin-top: auto; border-top: 1px solid var(--side-2); padding-top: 12px; display: grid; gap: 6px; }
  .hl { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 10px 8px; }
  .hl span { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; background: var(--side-2); padding: 2px 8px; border-radius: 6px; }
  .hl i { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }
  .hl .warn i { background: #f59e0b; }
  .me { display: flex; align-items: center; gap: 10px; padding: 8px 10px; color: #e5e7eb; font-weight: 500; }
  .me .av { width: 30px; height: 30px; border-radius: 50%; background: #374151; display: grid; place-items: center; font-weight: 600; }
  .me small { display: block; color: #6b7280; font-size: .75rem; font-weight: 400; }

  /* ---------- list ---------- */
  .list { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .list-head { padding: 18px 18px 0; border-bottom: 1px solid var(--line); }
  .lh-row { display: flex; align-items: center; gap: 10px; }
  .lh-row h1 { font-size: 1.2rem; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .icon-btn { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); border: 1px solid var(--line); }
  .icon-btn:hover { background: var(--bg); color: var(--ink); }
  .lh-row .sp { margin-left: auto; display: flex; gap: 6px; }
  .search { display: flex; align-items: center; gap: 8px; margin-top: 14px; background: var(--bg); border-radius: 9px; padding: 8px 10px; color: var(--muted); }
  .search input { border: 0; outline: 0; background: none; font: inherit; flex: 1; min-width: 0; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .kpi b { font-size: 1.25rem; font-weight: 650; display: block; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: .7rem; color: var(--muted); font-weight: 500; line-height: 1.2; display: block; }
  .kpi.red { background: var(--red-soft); border-color: #fecaca; } .kpi.red b { color: var(--red); }
  .seg { display: flex; gap: 18px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; }
  .seg button { padding: 8px 0 10px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
  .seg button.on { color: var(--ink); border-color: var(--accent); }
  .seg sup { font-size: .68rem; font-weight: 600; color: var(--muted); margin-left: 2px; }
  .rows { overflow-y: auto; flex: 1; }
  .gl { padding: 14px 18px 6px; font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; padding: 12px 18px; border-left: 3px solid transparent; position: relative; }
  .row:hover { background: #fafbfc; }
  .row.sel { background: var(--accent-soft); border-left-color: var(--accent); }
  .row .av { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 650; font-size: .85rem; }
  .row .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { color: var(--muted); font-size: .85rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .tags { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--bg); color: var(--ink-2); white-space: nowrap; }
  .pill.red { background: var(--red-soft); color: var(--red); }
  .pill.amber { background: var(--amber-soft); color: var(--amber); }
  .pill.indigo { background: var(--accent-soft); color: var(--accent); }
  .pill.green { background: var(--green-soft); color: var(--green); }
  .row .rt { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .due { font-size: .78rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .due.red { color: var(--red); } .due.amber { color: var(--amber); }
  .prio { display: flex; gap: 2px; }
  .prio i { width: 4px; height: 12px; border-radius: 2px; background: var(--line-2); }
  .prio i.on { background: var(--ink-2); }
  .prio.hot i.on { background: var(--red); }
  .unread::before { content: ''; position: absolute; left: 6px; top: 22px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  /* ---------- detail pane ---------- */
  .pane { overflow-y: auto; min-width: 0; }
  .pane-top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); display: flex; align-items: center; gap: 8px; padding: 12px 28px; border-bottom: 1px solid var(--line); }
  .crumb { color: var(--muted); display: flex; align-items: center; gap: 6px; font-size: .85rem; min-width: 0; }
  .crumb b { color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toolbar { margin-left: auto; display: flex; gap: 6px; }
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); font-weight: 550; font-size: .85rem; white-space: nowrap; }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: #4338ca; }
  .pane-in { padding: 28px; max-width: 980px; }
  .hero { display: flex; gap: 18px; align-items: flex-start; }
  .hero .big { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 1.3rem; flex: none; }
  .hero h2 { margin: 2px 0 8px; font-size: 1.55rem; line-height: 1.25; letter-spacing: -0.02em; font-weight: 650; }
  .hero .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .summary { margin: 22px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; color: var(--ink-2); font-size: .95rem; }
  .summary .i { color: var(--accent); margin-top: 2px; }
  .summary small { display: block; color: var(--muted); font-size: .78rem; margin-top: 8px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .box + .box { margin-top: 18px; }
  .box-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .box-h small { color: var(--muted); font-weight: 500; }
  .act { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 12px; padding: 12px 16px; align-items: center; border-top: 1px solid var(--line); }
  .act:first-of-type { border-top: 0; }
  .chk { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line-2); display: grid; place-items: center; color: #fff; }
  .act.done .chk { background: var(--green); border-color: var(--green); }
  .act.done .at { text-decoration: line-through; color: var(--muted); }
  .at { font-weight: 550; }
  .act small { display: block; color: var(--muted); font-size: .8rem; }
  .who { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); white-space: nowrap; }
  .who .av { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: #e0e7ff; color: var(--accent); font-weight: 650; font-size: .72rem; }
  .who .av.empty { background: none; border: 1.5px dashed var(--line-2); color: var(--muted); }
  .needs { padding: 12px 16px; display: grid; gap: 8px; }
  .needs div { display: flex; gap: 10px; align-items: center; }
  .needs .chk { width: 18px; height: 18px; border-radius: 5px; }
  .ev { padding: 14px 16px; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; }
  .cal-ico { border-radius: 10px; border: 1px solid var(--line); overflow: hidden; text-align: center; }
  .cal-ico span { display: block; background: var(--red); color: #fff; font-size: .65rem; font-weight: 700; letter-spacing: .06em; padding: 2px 0; }
  .cal-ico b { display: block; font-size: 1.35rem; padding: 2px 0 4px; }
  .ev .moved { color: var(--amber); font-size: .8rem; font-weight: 600; }
  .tabs2 { display: flex; gap: 2px; padding: 6px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs2 button { padding: 6px 10px; border-radius: 7px; color: var(--muted); font-weight: 500; font-size: .85rem; white-space: nowrap; }
  .tabs2 button.on { background: var(--bg); color: var(--ink); }
  .srcl { padding: 6px 16px 12px; }
  .src { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; align-items: center; border-top: 1px solid var(--line); }
  .src:first-child { border-top: 0; }
  .src .ic { width: 34px; height: 34px; border-radius: 9px; background: var(--bg); display: grid; place-items: center; color: var(--ink-2); }
  .src b { font-weight: 550; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src small { color: var(--muted); font-size: .78rem; }
  .log { padding: 14px 16px; display: grid; gap: 14px; }
  .log div { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 12px; font-size: .88rem; }
  .log i { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--amber); }
  .log i.g { background: var(--line-2); }
  .log small { display: block; color: var(--muted); font-size: .78rem; }
  .ask { margin-top: 18px; display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 10px 16px; }
  .ask input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; }
  .ask .i-sparkle { color: var(--accent); }

  .tabbar, .m-top, .fab, .m-back { display: none; }

  /* ---------- tablet: icon sidebar ---------- */
  @media (max-width: 1180px) {
    .app { grid-template-columns: 68px 360px minmax(0, 1fr); }
    .side { padding: 16px 10px; align-items: center; }
    .side .lbl, .nv span:not(.kv), .nv .ct, .nv small, .hl, .me div, .logo span:last-child { display: none; }
    .nv { justify-content: center; padding: 10px; }
    .cols { grid-template-columns: minmax(0, 1fr); }
  }

  /* ---------- phone ---------- */
  @media (max-width: 760px) {
    html, body { height: auto; }
    body { background: var(--panel); }
    .app { display: block; height: auto; }
    .side { display: none; }
    .list { border: 0; padding-bottom: 84px; }
    .list-head { padding: 0 16px; }
    .lh-row { padding-top: 14px; }
    .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .kpi { padding: 7px 8px; }
    .row { padding: 14px 16px; }
    .row.sel { background: none; border-left-color: transparent; }
    .gl { padding: 16px 16px 4px; }
    .pane { display: none; }
    .m-kids { display: flex; gap: 6px; }
    .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; bottom: 0; left: 0; right: 0; background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); z-index: 20; }
    .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .68rem; color: var(--muted); font-weight: 500; padding: 4px 0; }
    .tabbar a.on { color: var(--accent); }
    .tabbar .snap { margin-top: -22px; }
    .tabbar .snap span { width: 52px; height: 52px; border-radius: 16px; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 20px -6px rgb(79 70 229 / 60%); }

    /* detail on phone = full screen */
    body.detail .list { display: none; }
    body.detail .pane { display: block; padding-bottom: 90px; background: var(--bg); min-height: 100vh; }
    .pane-top { padding: 10px 12px; }
    .crumb b, .crumb .cr-hide { display: none; }
    .m-back { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 550; }
    .toolbar .btn:not(.keep) { display: none; }
    .pane-in { padding: 18px 16px; }
    .hero .big { width: 42px; height: 42px; font-size: 1.1rem; border-radius: 12px; }
    .hero h2 { font-size: 1.3rem; }
    .m-cta { display: flex !important; position: fixed; left: 0; right: 0; bottom: 0; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); z-index: 20; }
    .m-cta .btn { flex: 1; justify-content: center; padding: 11px; font-size: .95rem; }
    body.detail .tabbar { display: none; }
  }
  .m-cta { display: none; }
  @media (min-width: 761px) { .m-kids { display: none; } }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script src="data.js"></script>
<script src="icons.js"></script>
<script>
  const { items, kids, fmt, kid, counts, detail, health, params } = MOCK;
  const isDetail = params.get('screen') === 'detail';
  if (isDetail) document.body.classList.add('detail');
  let seg = 'now';

  function dueCls(it) {
    const iso = MOCK.dateOf(it); if (!iso) return '';
    const n = MOCK.dayDiff(iso);
    return n < 0 ? 'red' : n <= 3 ? 'amber' : '';
  }
  const prio = (s) => `<span class="prio ${s >= 4 ? 'hot' : ''}">${[1, 2, 3, 4, 5].map((n) => `<i class="${n <= s ? 'on' : ''}"></i>`).join('')}</span>`;

  function row(it) {
    const k = kid(it.kid), a = it.action, e = it.event, iso = MOCK.dateOf(it);
    const tags = [
      it.overdue ? '<span class="pill red">Overdue</span>' : '',
      a && a.must && !it.overdue ? '<span class="pill">Required</span>' : '',
      a && !a.must ? '<span class="pill">Optional</span>' : '',
      a?.payment ? `<span class="pill green">${a.payment}</span>` : '',
      a?.form ? '<span class="pill indigo">Form</span>' : '',
      e && !a ? `<span class="pill">${icon('calendar', 11, 2)}${e.time ?? 'All day'}</span>` : '',
      it.change ? '<span class="pill amber">Changed</span>' : '',
      it.bucket === 'noted' ? '<span class="pill">Info</span>' : '',
    ].join('');
    return `<a class="row ${it.id === 'wandertag' ? 'sel' : ''} ${it.unread ? 'unread' : ''}" href="?screen=detail">
      <span class="av" style="background:${k.color}">${k.name[0]}</span>
      <span style="min-width:0"><div class="t">${it.title}</div><div class="s">${it.summary}</div><div class="tags">${tags}</div></span>
      <span class="rt"><span class="due ${dueCls(it)}">${iso ? (it.bucket === 'done' ? fmt.short(it.doneAt) : fmt.rel(iso)) : fmt.ago(it.source.date)}</span>${prio(it.score)}</span>
    </a>`;
  }

  function rows() {
    let list;
    if (seg === 'now') list = items.filter((i) => i.bucket === 'now');
    else if (seg === 'coming') list = items.filter((i) => i.event && i.bucket !== 'done').sort((a, b) => a.event.date.localeCompare(b.event.date));
    else if (seg === 'noted') list = items.filter((i) => i.bucket === 'noted');
    else if (seg === 'done') list = items.filter((i) => i.bucket === 'done');
    else list = items;
    if (seg === 'now') {
      const week = list.filter((i) => MOCK.dayDiff(MOCK.dateOf(i)) <= 7);
      const later = list.filter((i) => MOCK.dayDiff(MOCK.dateOf(i)) > 7);
      return `<div class="gl">Due within 7 days</div>${week.map(row).join('')}<div class="gl">Later</div>${later.map(row).join('')}`;
    }
    return list.map(row).join('');
  }

  function sidebar() {
    return `<nav class="side">
      <div class="logo"><span class="m">${icon('school', 17, 2)}</span><span>School Agent</span></div>
      <a class="nv on" href="?">${icon('inbox', 18)}<span>Inbox</span><span class="ct">${counts.now}</span></a>
      <a class="nv" href="#">${icon('calendar', 18)}<span>Calendar</span></a>
      <a class="nv" href="#">${icon('search', 18)}<span>Search</span></a>
      <a class="nv" href="#">${icon('camera', 18)}<span>Snap a letter</span></a>
      <a class="nv" href="#">${icon('audit', 18)}<span>Audit trail</span></a>
      <a class="nv" href="#">${icon('settings', 18)}<span>Settings</span></a>
      <div class="lbl">Children</div>
      <a class="nv on" href="#"><span class="kv" style="background:#4b5563">★</span><span>Everyone</span></a>
      ${kids.map((k) => `<a class="nv" href="#"><span class="kv" style="background:${k.color}">${k.name[0]}</span><span>${k.name}</span><small>${k.klass}</small></a>`).join('')}
      <div class="side-foot">
        <div class="lbl" style="padding-top:4px">Connections</div>
        <div class="hl">${health.map((h) => `<span class="${h.status}" title="${h.note}"><i></i>${h.name}</span>`).join('')}</div>
        <div class="me"><span class="av">R</span><div>Morgan<small>Admin · English</small></div></div>
      </div>
    </nav>`;
  }

  function listCol() {
    return `<section class="list">
      <div class="list-head">
        <div class="lh-row"><h1>Inbox</h1>
          <span class="sp"><span class="m-kids">${kids.map((k) => `<span class="icon-btn" style="background:${k.color};color:#fff;border:0;font-weight:700">${k.name[0]}</span>`).join('')}</span><button class="icon-btn">${icon('filter', 16)}</button></span></div>
        <label class="search">${icon('search', 16)}<input placeholder="Search letters and dates" /></label>
        <div class="kpis">
          <div class="kpi red"><b>${counts.overdue}</b><span>Overdue</span></div>
          <div class="kpi"><b>3</b><span>Due this week</span></div>
          <div class="kpi"><b>4</b><span>Events ahead</span></div>
          <div class="kpi"><b>2</b><span>Unread info</span></div>
        </div>
        <div class="seg" id="seg">${[['now', 'Needs us', counts.now], ['coming', 'Coming', counts.coming], ['noted', 'Info', counts.noted], ['done', 'Done', ''], ['all', 'All', '']].map(([k, l, n]) =>
          `<button data-k="${k}" class="${seg === k ? 'on' : ''}">${l}${n ? `<sup>${n}</sup>` : ''}</button>`).join('')}</div>
      </div>
      <div class="rows" id="rows">${rows()}</div>
    </section>`;
  }

  function pane() {
    const d = detail, k = kid(d.kid), e = d.events[0];
    return `<section class="pane">
      <div class="pane-top">
        <a class="m-back" href="?">${icon('chevL', 18, 2.2)} Inbox</a>
        <span class="crumb"><span class="cr-hide">Inbox</span><span class="cr-hide">${icon('chevR', 14)}</span><b>${d.title}</b></span>
        <span class="toolbar">
          <button class="btn">${icon('user', 15)} Assign</button>
          <button class="btn">${icon('bellOff', 15)} Mute</button>
          <button class="btn primary">${icon('check', 15, 2.4)} Done</button>
          <button class="btn keep" style="padding:7px 9px">${icon('more', 16)}</button>
        </span>
      </div>
      <div class="pane-in">
        <div class="hero"><span class="big" style="background:${k.color}">${k.name[0]}</span>
          <div style="min-width:0"><h2>${d.title}</h2>
            <div class="tags"><span class="pill indigo">Needs us</span><span class="pill">${k.name} · ${k.klass}</span><span class="pill amber">Changed today</span><span class="pill">Opened ${fmt.short(d.opened)}</span>${prio(d.score)}</div></div></div>
        <div class="summary">${icon('sparkle', 18)}<div>${d.summary}<small>AI summary from 2 sources · check the original for exact wording</small></div></div>
        <div class="cols">
          <div>
            <div class="box"><div class="box-h">Actions <small>1 of 3 done</small></div>
              ${d.actions.map((a) => `<div class="act ${a.done ? 'done' : ''}"><span class="chk">${a.done ? icon('check', 12, 3) : ''}</span>
                <span style="min-width:0"><span class="at">${a.title}</span><small>${a.done ? 'Completed by ' + a.who : `Due ${fmt.wdShort(a.due)} · ${a.must ? 'Required' : 'Optional'}`}</small></span>
                <span class="who">${a.who ? `<span class="av">${a.who[0]}</span>${a.who}` : '<span class="av empty">+</span>Unassigned'}</span></div>`).join('')}</div>
            <div class="box"><div class="tabs2"><button class="on">Sources · 2</button><button>Changes · 2</button><button>History</button><button>Evidence</button></div>
              <div class="srcl">${d.sources.map((s) => `<div class="src"><span class="ic">${icon(s.type === 'Email' ? 'mail' : 'file', 17)}</span><span style="min-width:0"><b>${s.title}</b><small>${s.type} · ${s.sender} · ${fmt.short(s.date)} · ${s.lang}</small></span><button class="btn" style="padding:5px 9px">${icon('translate', 14)} Read</button></div>`).join('')}</div></div>
          </div>
          <div>
            <div class="box"><div class="box-h">Event</div>
              <div class="ev"><span class="cal-ico"><span>${fmt.mon(e.date).toUpperCase()}</span><b>${fmt.day(e.date)}</b></span>
                <span><b>${e.title}</b><div style="color:var(--ink-2)">${fmt.wd(e.date)} · ${e.time} – ${e.end}</div><div style="color:var(--muted)">${e.location}</div><div class="moved">Moved · ${e.note}</div></span></div></div>
            <div class="box"><div class="box-h">Jamie needs <small>by ${fmt.wdShort(e.date)}</small></div>
              <div class="needs">${d.needs.map((n) => `<div><span class="chk"></span>${n}</div>`).join('')}</div></div>
            <div class="box"><div class="box-h">What changed</div>
              <div class="log">${d.changes.map((c, i) => `<div><i class="${i ? 'g' : ''}"></i><span>${c.text}<small>${fmt.short(c.at)} ${fmt.time(c.at)} · ${c.from}</small></span></div>`).join('')}</div></div>
          </div>
        </div>
        <label class="ask">${icon('sparkle', 18)}<input placeholder="Ask about this letter — e.g. “Is lunch provided?”" /><button class="btn primary">${icon('send', 15)}</button></label>
      </div>
      <div class="m-cta"><button class="btn">${icon('user', 16)} Assign</button><button class="btn primary">${icon('check', 16, 2.4)} Done</button></div>
    </section>`;
  }

  function tabbar() {
    return `<nav class="tabbar">
      <a class="on" href="?">${icon('inbox', 22)}Inbox</a>
      <a href="#">${icon('calendar', 22)}Calendar</a>
      <a class="snap" href="#"><span>${icon('camera', 24)}</span></a>
      <a href="#">${icon('chat', 22)}Ask</a>
      <a href="#">${icon('settings', 22)}Settings</a>
    </nav>`;
  }

  function render() {
    document.getElementById('app').innerHTML = sidebar() + listCol() + pane() + tabbar();
    document.querySelectorAll('#seg button').forEach((b) => b.onclick = () => { seg = b.dataset.k; render(); });
  }
  render();
</script>
</body>
</html>
