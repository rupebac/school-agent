server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker can assign a new API address after a restart. Resolve it at request
    # time so nginx recovers without needing its own restart or reload.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $school_api http://school-api:8080;

    # Hashed Angular assets can be cached; HTML/favicon must not, or Cloudflare
    # will keep serving a previous origin's "Welcome to nginx" page.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /favicon.ico {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass $school_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "no-store";
    }

    location /actuator/ {
        proxy_pass $school_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Cache-Control "no-store";
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
